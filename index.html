      Array.prototype.slice.call(app.querySelectorAll('section,header,.hero,.landing-hero,.public-hero,[class*="hero"]')).forEach(function(el){
        if(looksLikeHero(el))el.setAttribute('data-cg-remove-hero','1');
      });
      app.style.marginTop='0'; app.style.paddingTop='0';
      Array.prototype.slice.call(app.children).some(function(el){
        if(el.getAttribute('data-cg-remove-hero')==='1')return false;
        el.style.marginTop='0';
        el.style.paddingTop='0';
        return true;
      });
    }
    function removeSpaces(){
      var b=document.querySelector('.cg-top-offer-banner'); if(!b)return;
      var prev=b.previousElementSibling, next=b.nextElementSibling;
      if(prev){prev.style.marginBottom='0';prev.style.paddingBottom=prev.style.paddingBottom||'0'}
      if(next){next.style.marginTop='0';next.style.paddingTop='0'}
    }
    function run(){markHomeHero();removeSpaces();}
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
    new MutationObserver(function(){requestAnimationFrame(run)}).observe(document.documentElement,{childList:true,subtree:true,characterData:true});
  })();
  </script>


  <script id="public-taxonomy-labels-v16" defer>
  (function(){
    'use strict';
    if(document.body && document.body.dataset && document.body.dataset.page === 'admin') return;
    var footerPhrase='شريط سفلي '+'أنيق للوصول السريع إلى قنوات بوابة النماذج الذكية وخدماتها.';
    function replaceText(v){
      if(!v) return v;
      return v
        .split('الدخول لل'+'تق'+'سيمات').join('الدخول للتصنيفات')
        .split('ال'+'تق'+'سيمات').join('التصنيفات')
        .split('تق'+'سيمات').join('تصنيفات')
        .split('ال'+'تق'+'سيم').join('التصنيف')
        .split('تق'+'سيم').join('تصنيف')
        .split(footerPhrase).join('');
    }
    function norm(t){return (t||'').replace(/\s+/g,' ').trim();}
    function clean(root){
      root=root||document.body;
      if(!root) return;
      var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){
        var p=n.parentElement;
        if(!p || /^(SCRIPT|STYLE|NOSCRIPT|TEXTAREA|CODE|PRE)$/i.test(p.tagName)) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }});
      var nodes=[];
      while(walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach(function(n){var v=replaceText(n.nodeValue); if(v!==n.nodeValue)n.nodeValue=v;});
      Array.prototype.slice.call(document.querySelectorAll('[aria-label],[title],[alt],[placeholder]')).forEach(function(el){
        ['aria-label','title','alt','placeholder'].forEach(function(a){
          if(el.hasAttribute(a)){var v=replaceText(el.getAttribute(a)); if(v!==el.getAttribute(a)) el.setAttribute(a,v);}
        });
      });
      Array.prototype.slice.call(document.querySelectorAll('.cg-social-note')).forEach(function(el){
        if(!norm(el.textContent) || norm(el.textContent)===norm(footerPhrase)) el.remove();
      });
    }
    function run(){clean(document.body);}
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',run); else run();
    new MutationObserver(function(){requestAnimationFrame(run);}).observe(document.documentElement,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['aria-label','title','alt','placeholder']});
  })();
  </script>
